name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # tests/test_mbasic2025.py rebuilds historic Microsoft BASIC binaries
    # byte for byte from mbasic2025's sources.
    - name: Check out mbasic2025
      uses: actions/checkout@v4
      with:
        repository: avwohl/mbasic2025
        path: mbasic2025
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Run the tests
      env:
        MBASIC2025_DIR: ${{ github.workspace }}/mbasic2025
        MBASIC2025_REQUIRED: '1'
      run: pytest tests -v -rw
