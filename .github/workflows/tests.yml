name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes well under a minute; a hang must not run for hours.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    # tests/test_mbasic2025.py rebuilds historic Microsoft BASIC binaries
    # byte for byte from mbasic2025's sources.  The checkout is pinned, so
    # that a commit to mbasic2025 alone cannot turn this repository's CI red
    # (the test pins the mbasic_52 image, which any change to those sources
    # changes).  To take a newer mbasic2025, change the ref here, run the
    # test, and update tests/test_mbasic2025.py in the same commit.
    - name: Check out mbasic2025
      uses: actions/checkout@v4
      with:
        repository: avwohl/mbasic2025
        ref: 1a19a485400f6de243e4d73cc13bec29440e101e
        path: mbasic2025
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Run the tests
      env:
        MBASIC2025_DIR: ${{ github.workspace }}/mbasic2025
        MBASIC2025_REQUIRED: '1'
      run: pytest tests -v -rw
